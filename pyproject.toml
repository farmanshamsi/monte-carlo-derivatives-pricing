[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-derivatives-pricing"
version = "1.0.0"
description = "Reproducible Monte Carlo pricing, variance reduction, convergence analysis, and Greeks for European derivatives."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Farman Elahi" },
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
notebook = [
  "jupyterlab>=4,<5",
]

[project.scripts]
mc-pricing-research = "monte_carlo_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "notebooks"]
line-length = 100
target-version = "py310"
